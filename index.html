        // ============================ TREE RENDERING ============================
        function renderTree() {
            const container = document.getElementById('treeContainer');
            const breadcrumb = document.getElementById('treeBreadcrumb');
            if (!container) return;
            const s = State.activeSubject;
            const d = State.subjectData[s];
            if (!d || !d.tree) {
                container.innerHTML = `<div class="empty">No files or folders yet.</div>`;
                return;
            }
            const path = State.selectedFolderPath || [];
            const node = getNodeByPath(d.tree, path);
            if (!node || node.type !== 'folder') {
                container.innerHTML = `<div class="empty">Invalid path</div>`;
                return;
            }

            let bcHtml = '';
            if (path.length === 0) {
                bcHtml =
                    `<span class="crumb crumb-root" data-nav="">root</span> <span class="sep">/</span> <span style="font-weight:600;color:var(--accent);">(current)</span>`;
            } else {
                bcHtml = `<span class="crumb crumb-root" data-nav="">root</span>`;
                for (let i = 0; i < path.length; i++) {
                    const p = path.slice(0, i + 1);
                    const n = getNodeByPath(d.tree, p);
                    if (n) {
                        bcHtml += `<span class="sep"> / </span>`;
                        if (i === path.length - 1) {
                            bcHtml += `<span class="crumb" style="font-weight:600;color:var(--accent);">${n.name}</span>`;
                        } else {
                            bcHtml += `<span class="crumb" data-nav="${p.join(',')}">${n.name}</span>`;
                        }
                    }
                }
            }
            breadcrumb.innerHTML = bcHtml;
            breadcrumb.querySelectorAll('.crumb[data-nav]').forEach(el => {
                el.addEventListener('click', () => {
                    const nav = el.dataset.nav;
                    if (nav === '') State.selectedFolderPath = [];
                    else State.selectedFolderPath = nav.split(',').map(Number);
                    renderTree();
                });
            });

            const children = node.children;
            if (children.length === 0) {
                container.innerHTML = `<div class="empty">This folder is empty. Add a folder or upload files.</div>`;
                return;
            }
            let html = '';
            children.forEach((child, idx) => {
                const isFolder = child.type === 'folder';
                const name = child.name || 'unnamed';
                const newPath = [...path, idx];

                let fileStatus = '';
                if (child.type === 'file') {
                    const statusMap = { ready: 'Ready', processing: 'Processing', error: 'Error',
                    empty: 'Empty' };
                    fileStatus =
                    `<span class="file-status ${child.status || 'empty'}">${statusMap[child.status] || child.status || 'Unknown'}</span>`;
                }

                let actions = '';
                if (isFolder) {
                    actions +=
                        `<button class="btn-icon" data-nav="${newPath.join(',')}" title="Open folder">${icon('folder')}</button>`;
                } else {
                    actions +=
                        `<button class="btn-icon" data-view="${newPath.join(',')}" title="View file">${icon('view')}</button>`;
                }
                actions +=
                    `<button class="btn-icon" data-del="${newPath.join(',')}" title="Delete">${icon('delete')}</button>`;

                html += `
              <div class="tree-item ${isFolder ? 'folder' : 'file'}">
                <div class="item-row">
                  <span class="icon">${isFolder ? icon('folder') : icon('file')}</span>
                  <span class="name">${name}</span>
                  ${fileStatus}
                  <span class="actions">${actions}</span>
                </div>
              </div>
            `;
            });

            container.innerHTML = html;

            container.querySelectorAll('[data-nav]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const pathArr = btn.dataset.nav.split(',').map(Number);
                    State.selectedFolderPath = pathArr;
                    renderTree();
                });
            });

            container.querySelectorAll('[data-view]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const pathArr = btn.dataset.view.split(',').map(Number);
                    const fileNode = getNodeByPath(d.tree, pathArr);
                    if (fileNode && fileNode.type === 'file') {
                        openPdfViewer(fileNode);
                    }
                });
            });

            container.querySelectorAll('[data-del]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const pathArr = btn.dataset.del.split(',').map(Number);
                    const { parent, index } = getParentAndIndex(d.tree, pathArr);
                    if (parent && index >= 0) {
                        parent.children.splice(index, 1);
                        persistSubject(s);
                        renderTree();
                        renderGenArea();
                    } else {
                        toast('Cannot delete root');
                    }
                });
            });

            const backBtn = document.getElementById('backFolderBtn');
            if (backBtn) {
                backBtn.disabled = State.selectedFolderPath.length === 0;
            }
        }

        // ============================ FILE UPLOAD ============================
        async function handleFileUpload(files, subjectId) {
            const s = subjectId;
            const d = State.subjectData[s];
            const path = State.selectedFolderPath || [];
            const node = getNodeByPath(d.tree, path);
            if (!node || node.type !== 'folder') {
                toast('Please select a folder first (click the folder icon to open it)');
                return;
            }
            for (const file of files) {
                const ext = file.name.split('.').pop().toLowerCase();
                if (!['pdf', 'docx', 'pptx', 'txt'].includes(ext)) { toast('Unsupported file: ' + file.name); continue; }
                const entry = {
                    type: 'file',
                    name: file.name,
                    ext: ext,
                    status: 'processing',
                    text: '',
                    addedAt: Date.now()
                };
                node.children.push(entry);
                persistSubject(s);
                renderTree();
                try {
                    const text = await extractText(file);
                    entry.text = text.trim();
                    entry.status = entry.text.length > 20 ? 'ready' : 'empty';
                    if (entry.status === 'ready') {
                        unlockAchievements();
                        logActivity('file', 'Uploaded ' + file.name, 5);
                    }
                } catch (err) {
                    entry.status = 'error';
                    console.error(err);
                }
                persistSubject(s);
                renderTree();
                renderGenArea();
            }
        }

        async function extractText(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (ext === 'txt') return await file.text();
            if (ext === 'pdf') {
                const buf = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
                let out = '';
                for (let p = 1; p <= pdf.numPages; p++) {
                    const page = await pdf.getPage(p);
                    const content = await page.getTextContent();
                    out += content.items.map(i => i.str).join(' ') + '\n';
                }
                return out;
            }
            if (ext === 'docx') {
                const buf = await file.arrayBuffer();
                const result = await mammoth.extractRawText({ arrayBuffer: buf });
                return result.value;
            }
            if (ext === 'pptx') {
                const buf = await file.arrayBuffer();
                const zip = await JSZip.loadAsync(buf);
                let out = '';
                const slideFiles = Object.keys(zip.files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n));
                for (const name of slideFiles) {
                    const xml = await zip.files[name].async('text');
                    const matches = xml.match(/<a:t>(.*?)<\/a:t>/g) || [];
                    out += matches.map(m => m.replace(/<\/?a:t>/g, '')).join(' ') + '\n';
                }
                return out;
            }
            throw new Error('Unsupported file type');
        }

        // ============================ PDF VIEWER ============================
        function openPdfViewer(material) {
            const backdrop = el(`
            <div class="pdf-modal-backdrop" id="pdfBackdrop">
              <div class="pdf-modal">
                <div class="pdf-toolbar">
                  <button class="icon-btn" id="pdfClose">${icon('delete')}</button>
                  <strong class="ui-font" style="font-size:0.80rem;">${material.name}</strong>
                  <input type="text" id="pdfSearch" placeholder="Search text…" />
                  <button class="icon-btn" id="zoomOut">－</button>
                  <span class="pg" id="zoomLabel">100%</span>
                  <button class="icon-btn" id="zoomIn">＋</button>
                  <button class="icon-btn" id="pdfFull" title="Fullscreen">⛶</button>
                </div>
                <div class="pdf-body"><div class="pdf-text-fallback" id="pdfText" style="font-size:1rem;"></div></div>
              </div>
            </div>
          `);
            document.body.appendChild(backdrop);
            let zoom = 1;
            const textEl = backdrop.querySelector('#pdfText');
            const raw = material.text || '(No extractable text found in this file.)';
            textEl.textContent = raw;
            backdrop.querySelector('#pdfClose').addEventListener('click', () => backdrop.remove());
            backdrop.addEventListener('click', e => { if (e.target === backdrop) backdrop.remove(); });
            backdrop.querySelector('#zoomIn').addEventListener('click', () => {
                zoom = Math.min(2, zoom + 0.1);
                textEl.style.fontSize = (zoom) + 'rem';
                backdrop.querySelector('#zoomLabel').textContent = Math.round(zoom * 100) + '%';
            });
            backdrop.querySelector('#zoomOut').addEventListener('click', () => {
                zoom = Math.max(0.6, zoom - 0.1);
                textEl.style.fontSize = (zoom) + 'rem';
                backdrop.querySelector('#zoomLabel').textContent = Math.round(zoom * 100) + '%';
            });
            backdrop.querySelector('#pdfFull').addEventListener('click', () => {
                const modal = backdrop.querySelector('.pdf-modal');
                if (!document.fullscreenElement) modal.requestFullscreen?.();
                else document.exitFullscreen?.();
            });
            backdrop.querySelector('#pdfSearch').addEventListener('input', e => {
                const q = e.target.value.trim();
                if (!q) { textEl.innerHTML = raw; return; }
                const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
                textEl.innerHTML = raw.replace(re,
                    '<mark style="background:var(--accent-2);color:var(--ink);padding:1px 4px;border-radius:4px;">$1</mark>'
                    );
            });
        }

        // ============================ QUIZ ============================
        async function startQuizFlow(mode, fromGenerate = false) {
            const s = State.activeSubject;
            const d = State.subjectData[s];

            if (mode === 'mistakes') {
                if (!d.mistakes || !d.mistakes.length) { toast('No mistakes recorded yet for this subject — nice!');
                    return; }
                beginQuiz(mode, d.mistakes.slice(0, 12));
                return;
            }

            const allText = getAllFileTexts(d.tree);
            if (!allText.trim()) { toast('No readable text found in uploaded files.'); return; }

            const count = mode === 'quick' ? 8 : mode === 'challenge' ? 10 : mode === 'survival' ? 15 : 6;
            const difficulty = mode === 'challenge' ? 'hard' : mode === 'quick' ? 'medium' : 'easy-medium';

            State.view = 'quiz';
            State.quiz = { mode, loading: true, questions: [], idx: 0, correct: 0, xp: 0, answered: false, timer: null,
                timeLeft: 0, streakLocal: 0 };
            render();

            try {
                const qs = await generateQuestions(allText, count, difficulty);
                if (!qs || !qs.length) throw new Error('empty');
                State.quiz.questions = qs;
                State.quiz.loading = false;
                render();
            } catch (err) {
                console.error(err);
                State.quiz.loading = false;
                State.quiz.error = 'Question generation failed. Please try again — (' + err.message + ')';
                render();
            }
        }

        function beginQuiz(mode, questions) {
            State.view = 'quiz';
            State.quiz = { mode, loading: false, questions, idx: 0, correct: 0, xp: 0, answered: false, timer: null,
                timeLeft: 0, streakLocal: 0 };
            render();
        }

        function xpForAnswer(mode, correct) {
            if (!correct) return 0;
            const base = { quick: 10, practice: 8, challenge: 18, survival: 14, mistakes: 12 } [mode] || 10;
            return base;
        }

        function renderQuiz(app) {
            const q = State.quiz;
            app.innerHTML = `<div class="wrap"><div class="quiz-wrap" id="quizWrap"></div></div>`;
            const wrap = app.querySelector('#quizWrap');

            if (q.loading) {
                wrap.innerHTML = `
              <div class="card" style="text-align:center;padding:50px 20px;">
                <div class="loading-line" style="justify-content:center;font-size:1rem;">
                  <span class="spinner"></span> Generating your reviewer from uploaded material…
                </div>
              </div>`;
                return;
            }
            if (q.error) {
                wrap.innerHTML = `
              <div class="card" style="text-align:center;padding:40px 20px;">
                <p class="ui-font" style="color:var(--ink-soft);">${q.error}</p>
                <button class="btn btn-ghost" id="backSub">Back to subject</button>
              </div>`;
                wrap.querySelector('#backSub').addEventListener('click', () => { State.view = 'subject';
                    render(); });
                return;
            }
            if (q.idx >= q.questions.length) {
                finishQuiz();
                return;
            }

            const total = q.questions.length;
            const current = q.questions[q.idx];
            const pct = Math.round((q.idx / total) * 100);

            wrap.innerHTML = `
            <div class="quiz-hud">
              <span class="pill">${labelForMode(q.mode)}</span>
              <span class="pill">Q ${q.idx + 1}/${total}</span>
              <span class="pill">${icon('correct')} ${q.correct} correct</span>
              <span class="pill">${icon('xp')} ${q.xp} XP</span>
              ${q.mode === 'challenge' ? `<span class="pill timer-ring" id="timerPill">⏱ 20s</span>` : ''}
            </div>
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div class="q-card">
              <div class="qtype">${current.type === 'mcq' ? 'Multiple Choice' : 'True or False'}</div>
              <h3>${current.question}</h3>
              <div class="opt-list" id="optList"></div>
              <div id="explainBox"></div>
              <div class="q-actions" id="qActions"></div>
            </div>
          `;

            const optList = wrap.querySelector('#optList');
            const options = current.type === 'mcq' ? current.options : ['True', 'False'];
            options.forEach((opt, i) => {
                const b = el(`<button class="opt">${opt}</button>`);
                b.addEventListener('click', () => answerQuestion(i, current, wrap));
                optList.appendChild(b);
            });

            if (q.mode === 'challenge') {
                startTimer(wrap, current);
            }
        }

        function labelForMode(m) {
            const map = { quick: 'Quick Quiz', practice: 'Practice Mode', challenge: 'Challenge Mode',
                survival: 'Survival', mistakes: 'Mistake Review' };
            return map[m] || m;
        }

        function startTimer(wrap, current) {
            clearInterval(State.quiz.timer);
            State.quiz.timeLeft = 20;
            const pill = wrap.querySelector('#timerPill');
            State.quiz.timer = setInterval(() => {
                State.quiz.timeLeft--;
                if (pill) pill.textContent = '⏱ ' + State.quiz.timeLeft + 's';
                if (State.quiz.timeLeft <= 0) {
                    clearInterval(State.quiz.timer);
                    if (!State.quiz.answered) answerQuestion(-1, current, wrap);
                }
            }, 1000);
        }

        function answerQuestion(chosenIdx, current, wrap) {
            const q = State.quiz;
            if (q.answered) return;
            q.answered = true;
            clearInterval(q.timer);

            let isCorrect;
            if (current.type === 'mcq') isCorrect = chosenIdx === current.answerIndex;
            else isCorrect = (chosenIdx === 0) === !!current.answer;

            const opts = wrap.querySelectorAll('.opt');
            opts.forEach((o, i) => o.classList.add('disabled'));
            const correctIdx = current.type === 'mcq' ? current.answerIndex : (current.answer ? 0 : 1);
            if (opts[correctIdx]) opts[correctIdx].classList.add('correct');
            if (chosenIdx >= 0 && chosenIdx !== correctIdx && opts[chosenIdx]) opts[chosenIdx].classList.add('wrong');

            wrap.querySelector('#explainBox').innerHTML =
                `<div class="explain"><strong>${isCorrect ? icon('correct') + ' Correct! ' : icon('wrong') + ' Not quite. '}</strong>${current.explanation || ''}</div>`;

            const s = State.activeSubject;
            const d = State.subjectData[s];

            if (isCorrect) {
                q.correct++;
                q.streakLocal++;
                const gained = xpForAnswer(q.mode, true);
                q.xp += gained;
                d.xp += gained;
                State.overall.xp += gained;
                State.overall.streak++;
                floatXp(gained, wrap);
                const optRect = (chosenIdx >= 0 && opts[chosenIdx]) ? opts[chosenIdx].getBoundingClientRect() : wrap
                    .getBoundingClientRect();
                launchConfetti(optRect.left + optRect.width / 2, optRect.top, q.streakLocal >= 3 ? 40 : 20);
                unlockAchievements();
            } else {
                q.streakLocal = 0;
                State.overall.streak = 0;
                if (!d.mistakes) d.mistakes = [];
                d.mistakes.unshift({ ...current });
                d.mistakes = d.mistakes.slice(0, 40);
            }
            State.overall.questions++;
            d.questionsCompleted++;
            if (isCorrect) State.overall.correct++;
            persistOverall();
            persistSubject(s);
            logActivity('quiz', (isCorrect ? 'Correct' : 'Wrong') + ' answer on ' + s, isCorrect ? gained : 0);

            const actions = wrap.querySelector('#qActions');
            if (q.mode === 'survival' && !isCorrect) {
                actions.innerHTML = `<button class="btn btn-primary" id="nextBtn">See Results</button>`;
                actions.querySelector('#nextBtn').addEventListener('click', () => { q.idx = q.questions.length;
                    render(); });
                return;
            }
            const isLast = q.idx === q.questions.length - 1;
            actions.innerHTML =
                `<button class="btn btn-primary" id="nextBtn">${isLast ? 'Finish' : 'Next Question'} →</button>`;
            actions.querySelector('#nextBtn').addEventListener('click', () => {
                q.idx++;
                q.answered = false;
                render();
            });
        }

        function floatXp(amount, wrap) {
            const rect = wrap.getBoundingClientRect();
            const f = document.createElement('div');
            f.className = 'xp-float';
            f.textContent = '+' + amount + ' XP';
            f.style.left = (rect.left + rect.width / 2 - 20) + 'px';
            f.style.top = (rect.top + 60) + 'px';
            document.body.appendChild(f);
            setTimeout(() => f.remove(), 1200);
        }

        function finishQuiz() {
            const q = State.quiz;
            const s = State.activeSubject;
            const d = State.subjectData[s];
            if (!d.scores) d.scores = [];
            d.scores.push({ mode: q.mode, correct: q.correct, total: q.questions.length, xp: q.xp, at: Date.now() });
            d.scores = d.scores.slice(-20);
            const streak = q.streakLocal;
            d.streak = Math.max(d.streak || 0, streak);
            persistSubject(s);
            State.view = 'summary';
            render();
            if (pctScore(q) >= 50) setTimeout(() => launchConfetti(window.innerWidth / 2, 120, 60), 250);
            unlockAchievements();
            logActivity('quiz', 'Completed ' + labelForMode(q.mode) + ' with ' + q.correct + '/' + q.questions.length,
                q.xp);
        }

        function pctScore(q) { return q.questions.length ? Math.round((q.correct / q.questions.length) * 100) : 0; }

        function renderSummary(app) {
            const q = State.quiz;
            const total = q.questions.length;
            const pct = total ? Math.round((q.correct / total) * 100) : 0;
            const s = subjectMeta(State.activeSubject);
            app.innerHTML = `
            <div class="wrap">
              ${header(true, s ? s.name : 'Summary')}
              <div class="quiz-wrap">
                <div class="card summary-card reveal show">
                  <div class="ui-font" style="text-transform:uppercase;letter-spacing:0.14em;font-size:0.68rem;color:var(--ink-soft);">${labelForMode(q.mode)} complete</div>
                  <div class="big">${pct}%</div>
                  <div class="summary-grid">
                    <div><div class="num">${q.correct}/${total}</div><div class="lbl">Correct</div></div>
                    <div><div class="num">${q.xp}</div><div class="lbl">XP earned</div></div>
                    <div><div class="num">${q.streakLocal}</div><div class="lbl">Best streak</div></div>
                  </div>
                  <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
                    <button class="btn btn-primary" id="retryBtn">${icon('retry')} Retry</button>
                    <button class="btn btn-ghost" id="mistakeBtn">${icon('mistake')} Review Mistakes</button>
                    <button class="btn btn-ghost" id="backBtn">${icon('back')} Back to Subject</button>
                  </div>
                </div>
              </div>
              ${footer()}
            </div>
          `;
            app.querySelector('#themeToggle').addEventListener('click', toggleTheme);
            app.querySelectorAll('.season-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const season = btn.dataset.season;
                    applySeason(season);
                    app.querySelectorAll('.season-btn').forEach(b => b.classList.toggle('active', b.dataset
                        .season === season));
                });
            });
            app.querySelectorAll('.weather-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const type = btn.dataset.weather;
                    toggleWeather(type);
                    btn.classList.toggle('active', State.weather[type]);
                });
            });
            app.querySelector('#crumbHome').addEventListener('click', () => { State.view = 'home';
                render(); });
            app.querySelector('#retryBtn').addEventListener('click', () => startQuizFlow(q.mode));
            app.querySelector('#mistakeBtn').addEventListener('click', () => startQuizFlow('mistakes'));
            app.querySelector('#backBtn').addEventListener('click', () => { State.view = 'subject';
                render(); });

            app.querySelector('#exportDataBtn')?.addEventListener('click', exportData);
            app.querySelector('#importDataInput')?.addEventListener('change', importData);
        }

        // ============================ AI QUESTION GENERATION ============================
        async function generateQuestions(sourceText, count, difficulty) {
            const trimmed = sourceText.slice(0, 9000);
            const sys =
                `You are a strict exam-writer for Filipino college students. You ONLY use the study material text given to you — never outside facts. Return ONLY valid JSON, no markdown fences, no commentary.`;
            const user = `STUDY MATERIAL:
        """
        ${trimmed}
        """

        Write ${count} review questions based ONLY on the study material above, difficulty level "${difficulty}".
        Mix of types: about 65% "mcq" (multiple choice, 4 options) and 35% "tf" (true or false).
        Test real understanding, not just keyword matching.

        Return a JSON array only, matching exactly this shape:
        [
          {
            "type":"mcq",
            "question":"...",
            "options":["...","...","...","..."],
            "answerIndex":0,
            "explanation":"short explanation citing the material"
          },
          {
            "type":"tf",
            "question":"a statement that is either true or false",
            "answer":true,
            "explanation":"short explanation citing the material"
          }
        ]`;
            const resp = await fetch("https://api.anthropic.com/v1/messages", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "claude-sonnet-4-6",
                    max_tokens: 2200,
                    system: sys,
                    messages: [{ role: "user", content: user }]
                })
            });
            if (!resp.ok) throw new Error('AI request failed (' + resp.status + ')');
            const data = await resp.json();
            const text = (data.content || []).map(b => b.text || '').join('\n');
            const clean = text.replace(/```json|```/g, '').trim();
            const jsonStart = clean.indexOf('[');
            const jsonEnd = clean.lastIndexOf(']');
            if (jsonStart === -1 || jsonEnd === -1) throw new Error('Could not parse AI response');
            let arr = JSON.parse(clean.slice(jsonStart, jsonEnd + 1));
            arr = arr.map(q => {
                if (q.type === 'mcq' && Array.isArray(q.options)) {
                    const correct = q.options[q.answerIndex];
                    const shuffled = [...q.options];
                    for (let i = shuffled.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i +
                            1));
                        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]]; }
                    q.options = shuffled;
                    q.answerIndex = shuffled.indexOf(correct);
                }
                return q;
            });
            return arr;
        }

        // ============================ FAB ============================
        function updateFabState() {
            const menu = document.getElementById('fabMenu');
            if (menu) {
                menu.classList.toggle('open', document.getElementById('fabBtn')?.dataset.open === 'true');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const fabBtn = document.getElementById('fabBtn');
            const fabMenu = document.getElementById('fabMenu');

            if (fabBtn) {
                fabBtn.addEventListener('click', () => {
                    const open = fabBtn.dataset.open === 'true';
                    fabBtn.dataset.open = open ? 'false' : 'true';
                    fabMenu.classList.toggle('open', !open);
                    fabBtn.innerHTML = open ? icon('plus') : icon('delete');
                });
            }

            document.querySelectorAll('.fab-item').forEach(item => {
                item.addEventListener('click', () => {
                    const action = item.dataset.action;
                    if (action === 'home') {
                        State.view = 'home';
                        render();
                    } else if (action === 'quiz') {
                        const activeCard = document.querySelector('.subject-card');
                        if (activeCard) {
                            const id = activeCard.dataset.id;
                            if (id) {
                                State.activeSubject = id;
                                State.view = 'subject';
                                State.selectedFolderPath = [];
                                render();
                                setTimeout(() => {
                                    const genBtn = document.querySelector('#genBtn');
                                    if (genBtn) genBtn.click();
                                }, 300);
                            }
                        } else {
                            toast('Open a subject first to generate a quiz');
                        }
                    } else if (action === 'timer') {
                        const timerBtn = document.querySelector('#timerStartBtn');
                        if (timerBtn) {
                            timerBtn.scrollIntoView({ behavior: 'smooth' });
                            if (State.timer.running) pauseTimer();
                            else startTimer();
                        }
                    } else if (action === 'forecast') {
                        document.querySelector('.forecast-card')?.scrollIntoView({ behavior: 'smooth' });
                    }
                    fabBtn.dataset.open = 'false';
                    fabMenu.classList.remove('open');
                    fabBtn.innerHTML = icon('plus');
                });
            });
        });

        // ============================ KEYBOARD SHORTCUTS ============================
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                const searchInput = document.querySelector('#searchInput');
                if (searchInput) {
                    searchInput.focus();
                    searchInput.select();
                }
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'q') {
                e.preventDefault();
                const activeCard = document.querySelector('.subject-card');
                if (activeCard) {
                    const id = activeCard.dataset.id;
                    if (id) {
                        State.activeSubject = id;
                        State.view = 'subject';
                        State.selectedFolderPath = [];
                        render();
                        setTimeout(() => {
                            const genBtn = document.querySelector('#genBtn');
                            if (genBtn) genBtn.click();
                        }, 300);
                    }
                } else {
                    toast('Open a subject first to generate a quiz');
                }
            }
        });

        // ============================ INIT ============================
        (async function init() {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

            loadAll();

            if (State.timer.interval) {
                clearInterval(State.timer.interval);
                State.timer.interval = null;
                State.timer.running = false;
            }

            buildSky();
            applyTheme();
            applySeason(State.season);

            document.querySelectorAll('.season-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.season === State.season);
            });
            document.querySelectorAll('.weather-btn').forEach(btn => {
                const type = btn.dataset.weather;
                btn.classList.toggle('active', State.weather[type]);
            });

            unlockAchievements();

            render();
            startQuoteCycle();
            startClockUpdates();

            setInterval(() => {
                spawnParticles();
            }, 6000);
            setInterval(() => {
                spawnSeasonalDecorations();
            }, 10000);
            setInterval(() => {
                spawnFloatingPhoto();
            }, 14000);
        })();
    </script>
